<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invenire Library</title>
    <link rel="stylesheet" href="../css-style/main-pages/home.css">
    <link rel="stylesheet" href="../css-style/main-pages/sigup.css">
    <link href="./output.css" rel="stylesheet">
    <!-- Added FontAwesome CDN so your icons will work -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- ========current file js link ================== -->
    <script defer src="../js/auth-files/signup.js"></script>
    <!-- ========user authenthication js link ================== -->
    <script type="module" src="../js/auth-files/auth.js" defer></script>
    <!-- =================for google font============== -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Yaldevi:wght@400;700&display=swap" rel="stylesheet">

    <!-- ==========tailwind and font swesome -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="signup-body">
    <div class="signup-container">
        <section class="signup-card">
            <!-- =============header part============ -->
            <div class="signup-header">
                <div class="signup-logo">
                    <a href="./home.html"><img src="/images/logo/logo.png" alt="Logo"></a>
                </div>
                <div class="nav-part">
                    <!-- 1st: Theme Dropdown -->
                    <div class="theme-dropdown">
                        <button type="button" class="dropdown-header" id="themeDropdownBtn">
                            <i class="fa-solid fa-palette"></i>
                        </button>
                        <ul class="dropdown-menu" id="themeDropdownMenu">
                            <li data-value="light">☀️ Light</li>
                            <li data-value="dark">🌙 Dark</li>
                            <li data-value="neon">⚡ Neon</li>
                            <li data-value="retro">🕹️ Retro</li>
                        </ul>
                    </div>

                    <!-- 2nd: Language Dropdown -->
                    <div class="lang-dropdown">
                        <button type="button" class="dropdown-header" id="langDropdownBtn">
                            <i class="fa-solid fa-earth-americas"></i>
                        </button>
                        <ul class="dropdown-menu" id="langDropdownMenu">
                            <li data-value="En">English</li>
                            <li data-value="Da">Dari</li>
                            <li data-value="Pa">Pashto</li>
                        </ul>
                    </div>
                </div>

            </div>
            <!-- ==============form start from here================ -->
            <div class="form-container">
                <div class="side-banner">
                    <div class="banner"><img src="../images/banner/signup.png" alt=""></div>
                </div>
                <form id="signupForm" class="signup-form">
                <div class="form-row 1 form-header">
                    <h1 class="text-2xl font-bold p-4">Create your Invenire Library account.</h1>
                </div>
                <div class="form-row form-row2">
                    <!-- Full Name -->
                    <div class="input-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                        <small id="fullNameError" class="error-message"></small>
                    </div>
                </div>
                <div class="form-row form-row3">
                    <!-- Email -->
                    <div class="input-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" name="email" placeholder="Enter your email">
                        <small id="emailError" class="error-message"></small>
                    </div>
                </div>
                <div class="form-row form-row4">
                    <!-- Gender -->
                    <!-- Gender Custom Dropdown -->
                    <div class="input-group gender">
                        <label for="genderDropdownBtn">Gender</label>
                        <div class="gender-dropdown">
                            <!-- The header trigger displays like an input block -->
                            <button type="button" class="dropdown-header form-input-dropdown" id="genderDropdownBtn">
                                <span id="selected-gender">Select your gender</span>
                                <i class="fa-solid fa-chevron-down arrow-icon"></i>
                            </button>

                            <!-- Hidden inputs allow standard form collection -->
                            <input type="hidden" name="gender" id="genderHiddenInput" value="">

                            <!-- The option menu list matching your layout coordinates -->
                            <ul class="dropdown-menu form-dropdown-menu" id="genderDropdownMenu">
                                <li data-value="male">Male</li>
                                <li data-value="female">Female</li>
                                <li data-value="other">Other</li>
                            </ul>
                        </div>
                        <small id="genderError" class="error-message"></small>
                    </div>

                    <!-- Location -->
                    <div class="input-group location">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location" placeholder="Enter your location">
                        <small id="locationError" class="error-message"></small>
                    </div>
                </div>
                <div class="form-row form-row5">
                    <!-- Password -->
                    <div class="input-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" name="password" placeholder="Create a password">
                        <small id="passwordError" class="error-message"></small>
                    </div>

                    <!-- Confirm Password -->
                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Confirm your password">
                        <small id="confirmPasswordError" class="error-message"></small>
                    </div>
                </div>

                <!-- General error -->
                <p id="signupError" class="form-error"></p>

                <!-- Button -->
                <div class="signup-btns">
                    <div class="already-account">
                        <p class="already-account-text">Already have an account?</p>
                        <a href="/pages/login.html">logIn</a>
                    </div>
                    <button type="submit" class="signup">Sign Up</button>
                </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
