<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin dashboard</title>
    <link rel="stylesheet" href="../css-style/home.css">
    <link rel="stylesheet" href="../css-style/adminDashboard.css">
    <link href="/src/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer type="module" src="../js/dashboard.js"></script>
    <script defer src="../js/dashboard.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <!-- main container include main body sidebar and header -->
    <div class="dashboard-container">
        <aside class="sidebar"> 
            <div class="logo"></div>
            <hr class="h-px bg-gray-300 border-0">
            <div class="sidebar-menu">
                <div class="menu-item">
                    <i class="fa-solid fa-bell"></i>
                    <span class="menu-text">Notifications</span> 
                </div>
                <div class="menu-item active">
                    <i class="fa-solid fa-th-large"></i>
                    <span class="menu-text">Dashboard</span>
                </div>
                <div class="menu-item">
                    <i class="fa-solid fa-book"></i>
                    <span class="menu-text">Books</span>
                </div>
                <div class="menu-item">
                    <i class="fa-solid fa-users"></i>
                    <span class="menu-text">Members</span>
                </div>
                <div class="menu-item">
                    <i class="fa-solid fa-cog"></i>
                    <span class="menu-text">Settings</span>
                </div>
                <div class="menu-item">
                    <i class="fa-solid fa-chart-bar"></i>
                    <span class="menu-text">Reports</span>
                </div>
                <hr class="w-full h-px bg-gray-400 border-0">
                <div class="menu-item" id="#">
                    <i class="fa-solid fa-question-circle"></i>
                    <span class="menu-text">Help</span>
                </div>
                <div class="menu-item">
                    <i class="fa-solid fa-palette"></i>
                    <span class="menu-text">Theme</span>
                </div>

                <button class="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout
                </button>
            </div>
        </aside>

        <!-- main content of body plus header start from here -->
        <div class="main-content">
            <header class="admin-header">
                <div class="search-bar">
                    <input type="text" placeholder="Search books" class="search-input">
                </div>
                <div class="date-time"></div>
                <div class="profile"></div>
            </header>
            <!-- Your main page content goes here -->
        </div>

    </div>
</body>
</html>
