<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin dashboard</title>
    <link rel="stylesheet" href="../css-style/main-pages/adminDashboard.css">
    <link rel="stylesheet" href="../css-style//main-pages/home.css">
    <link href="/src/output.css" rel="stylesheet">
    <script type="module" src="../js/dashboard/dashboard.js" defer></script>
    <script type="module" src="../js/dashboard/search.js" defer></script>
    <script type="module" src ="../js/dashboard/profile.js" defer></script>
    <script type="module" src="../js/dashboard/cards.js" defer></script>
    <script type="module" src="../js/dashboard/books_search.js" defer></script>
    <script type="module" src="../js/dashboard/members_search.js" defer></script>
    <script type="module" src="../js/dashboard/chart_bar.js" defer></script>
    <script type="module" src="../js/dashboard/donutChart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <!-- main container include main body sidebar and header -->
    <div class="dashboard-container">
        <aside class="sidebar"> 
            <div class="logo"></div>
            <hr class="h-px bg-gray-300 border-0">
            <div class="sidebar-menu">
                <div class="menu-item">
                    <i class="fa-solid fa-bell menu-icon"></i>
                    <span class="menu-text">Notifications</span>
                </div>
                <div class="menu-item active">
                    <i class="fa-solid fa-th-large menu-icon"></i>
                    <span class="menu-text">Dashboard</span>
                </div>
                <div class="menu-item">
                    <i class="fa-solid fa-book menu-icon"></i>
                    <span class="menu-text">Books</span>
                </div>
                <div class="menu-item">
                    <i class="fa-solid fa-users menu-icon"></i>
                    <span class="menu-text">Members</span>
                </div>
                <div class="menu-item">
                    <i class="fa-solid fa-cog menu-icon"></i>
                    <span class="menu-text">Settings</span>
                </div>
                <div class="menu-item">
                    <i class="fa-solid fa-chart-bar menu-icon"></i>
                    <span class="menu-text">Statistic</span>
                </div>
                <hr class="w-full h-px bg-gray-400 border-0">
                <div class="menu-item">
                    <a href="./admin_subPages/theme.html">
                    <i class="fa-solid fa-palette menu-icon"></i>
                    <span class="menu-text">Theme</span></a>
                </div>

                <button class="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout
                </button>
            </div>
        </aside>

        <!-- main content of body plus header start from here -->
        <div class="main-content">
            <!-- HEADER PART -->
            <header class="admin-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search books,members,author...." class="search-input" autocomplete="off">
                    <!-- a dropdown container shows the search result -->
                    <div class="searchResult" id="search-dropDown"></div>
                </div>
                <div class="calender">
                    <div class="time">12:45</div>
                    <div class="h-4 w-[1px] bg-slate-600 mx-2"></div>
                    <div class="date">21/July/2026</div>
                </div>
                <div class="profile-container">
                    <div class="profile"></div>
                </div>
            </header>
            <!-- Your main page content goes here -->
            <main class="justify-center flex flex-col items-center">
               <div class="headline-content">
                   <h1 class="headline">Active Members</h1> <!-- showing the latest news for active members -->
                   <button class="checkout-btn">+ Checkout</button>
               </div>
            <div class="form-group">
                <div class="card card1"></div>
                <div class="card card2"></div>
                <div class="card card3"></div>
                <div class="card card4"></div>
                <div class="card card5" id="chart-bars"><div class="traffic-chart"></div></div>
                <div class="card card6"></div>
                <div class="card card7"></div>
                <div class="card card8"></div>
            </div>
            </main>
            <!-- footer -->
            <footer class="dashboard-footer">
            <p class="footer-text"></p>
            <div class="footer-nav"></div>
        </footer>
        </div>
    </div>
</body>
</html>
