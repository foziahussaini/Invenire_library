<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminBooks Management</title>
    <link href="/src/output.css" rel="stylesheet">
    <!--======================ROOT CSS FILE=====================-->
    <link rel="stylesheet" href="../../css-style/root.css"> <!-- for the base root linked-->
    <link rel="stylesheet" href="../../css-style/sub-pages/books.css">
    <!-- =================responsive css paths======================-->
    <link rel="stylesheet" href="../../responsive/dashboard/sidebar_profile_responsive.css"> 
    <link rel="stylesheet" href="../../responsive/dashboard/book-responsive.css">
    <!-- ====================search bar JS=================== -->
    <script type="module" src="../../js/dashboard/search_bar/search.js" defer></script>
    <script type="module" src="../../js/dashboard/search_bar/books_search.js" defer></script>
    <script type="module" src="../../js/dashboard/search_bar/members_search.js" defer></script>
    <script type="module" src="../../js/dashboard/sub_pages/books/books_list.js" defer></script>
    <script type="module" src="../../js/dashboard/sub_pages/books/addBooks.js" defer></script>
    <!-- ====================PROFILE LINK JS=================== -->
    <script type="module" src="../../js/auth-files/profile.js"></script>
    <!-- =================logut logic js file -->
    <script type="module" src="../../js/auth-files/logout.js"></script>
    <!-- ====================current JS===================  -->
    <script src="../../js/dashboard/sub_pages/books.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body>
    <!-- main container include main body sidebar and header -->
    <div class="books-container">
        <!-- ================SIDEBAR SECTION==================== -->
        <aside class="book-sidebar"> 
            <div class="logo">
                <img src="/images/logo/logo.png" alt="Invenire Library" class="logo">
            </div>
            <hr class="h-px bg-gray-300 border-0">
            <div class="sidebar-menu">
                <div class="menu-item">
<!-- ===================used two different <a> on every item cause responsive style not crash======================= -->
                    <a class="menu-icon" href="../home.html">
                        <i class="fa-solid fa-home"></i>
                    </a>
                    <a href="../home.html" class="menu-text">Home</a>
                </div>
                <div class="menu-item" data-route="Dashboard">
                    <a class="menu-icon" href="../admin_dashboard.html">
                        <i class="fa-solid fa-th-large"></i>
                    </a>
                    <a href="../admin_dashboard.html"><span class="menu-text">Dashboard</span></a>
                </div>
                <div class="menu-item active" data-route="Books">
                    <a class="menu-icon" href="./books.html">
                        <i class="fa-solid fa-book"></i>
                    </a>
                    <a href="./books.html"><span class="menu-text">Books</span></a>
                </div>
                <div class="menu-item" data-route="Members">
                    <a class="menu-icon" href="./members.html">
                        <i class="fa-solid fa-users"></i>
                    </a>
                    <a href="./members.html">
                    <span class="menu-text">Members</span></a>
                </div>
                <div class="menu-item" data-route="Settings">
                    <a class="menu-icon" href="./settings.html">
                        <i class="fa-solid fa-cog "></i>
                    </a>
                    <a href="./settings.html">
                    <span class="menu-text">Settings</span></a>
                </div>
                <hr class="w-full h-px bg-gray-400 border-0">
                <div class="menu-item" data-route="Theme">
                    <a class="menu-icon" href="./theme.html">
                        <i class="fa-solid fa-palette"></i>
                    </a>
                    <a class="menu-text" href="./theme.html"></i>
                    <span class="menu-text">Theme</span></a>
                </div>

                <button class="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout
                </button>
            </div>
        </aside>
        <!-- ================MAIN SECTION==================== -->
        <!-- main content of body plus header start from here -->
        <div class="book-main-content">
            <!-- ================HEADER SECTION==================== -->
            <header class="admin-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search books,members,author...." class="search-input" autocomplete="off">
                    <!-- a dropdown container shows the search result -->
                    <div class="searchResult" id="search-dropDown"></div>
                </div>
                <div class="calender">
                    <div class="time">12:45</div>
                    <!-- layout added as tailwind css here -->
                    <div class="divider-line h-4 w-[0.4px] bg-slate-600 mx-2 xs:w-8 xs:h-[0.4px] sm:w-10 sm:h-[0.4px] md:w-16 md:h-[1px] lg:h-4 lg:w-[1px]"></div>
                    <div class="date">21/July/2026</div>
                </div>
                <div class="profile-container">
                    <div class="profile">
                        <img src="../../images/profile/male.jpg" alt="">
                    </div>
                </div>
            </header>
            <br>
            <!-- ================HEADLINE TITLE SECTION==================== -->
            <div class="headline">
                <div class="title">
                    <P class="">ALL bOOKS IN lIBRARY</P>
                </div>
            </div>
            <!-- Main Table Container Structure -->
            <div class="main-books-list">
                <table class="books-table">
                <!-- Table Header Section -->
                    <thead>
                        <tr class="table-header">
                           <th>Book/author</th>
                           <th>Due Date</th>
                           <th>Edition</th>
                           <th class="text-center">Downloads</th>
                           <th class="text-center">Purchases</th>
                           <th class="text-center">On Read</th>
                           <th class="price">Price</th>
                           <th class="text-center">Actions</th>
                           <th class="text-center">All&nbsp;&nbsp;
                             <input type="checkbox" id="select-all" aria-label="Select all books">
                           </th>
                        </tr>
                    </thead>
        
                    <!-- Target container where JavaScript will inject table body rows -->
                    <tbody id="books-table-body" class="books-table-body">
                        <!-- JavaScript will insert <tr> rows here dynamically -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <td>
                                <button type="submit" id="delete-all-btn" class="delete-all-btn">Delete All</button>
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <!-- ============add books form card where admin can add book ==============-->
            <div class="book-form-card">
                <form action="" id="add-book-form" class="add-book-form 
                grid 
                grid-cols-1
                sm:grid-cols-1
                md:grid-cols-2
                lg:grid-cols-2
                gap-6
                ">
                <!-- tailwind grid 1 -->
                    <div class="form-grid left-part ">
                        <div class="form-group">
                            <label for="book Name">Book Name</label>
                            <input id="book-name" type="text" placeholder="e.g Boofe Koor" required>
                        </div>
                        <div class="form-group">
                            <label for="author">Author</label>
                            <input type="text" id="author" placeholder="e.g Paulo kiulo" required>
                        </div>
                        <div class="form-group">
                            <label for="edition">Edition</label>
                            <input type="text" id="edition" placeholder="e.g 2022 / 1st edition / fiction" required>
                        </div>
                        <div class="form-group">
                            <label for="shortDetails">Short details</label>
                            <textarea id="shortDetails" placeholder="message about book..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="pages">Pages</label>
                            <input type="text" id="pages" placeholder="430">
                        </div>
                        <div class="form-group">
                            <label for="language">Language</label>
                            <input type="text" id="language" placeholder="language">
                        </div>
                    </div>
                <!-- tailwind grid 2 -->
                    <div class="form-grid right-part">
                        <div class="form-group">
                            <label for="cover-image">Book cover</label>
                            <input type="url" name="cover image" id="cover-image"
                            placeholder="https://example.com/book-cover.jpg" required>
                            <div class="preview-image-row">
                                <img id="cover-preview" alt="cover image">
                                <img class="second-img"
                                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSJ4Doh2rVki_5dwPZat-FwyCPpbFSYC8Qw9ZA66QGKQ&s=10" alt="image">
                            </div>
                            </div>
                        <div class="form-group">
                            <label for="pdf url">book pdf/url</label>
                            <input type="url" id="pdf-url" placeholder="e.g example.pdf/ http/example.pdf">
                        </div>
                        <div class="form-group">
                            <label for="audio url">Audio url</label>
                            <input type="text" id="audio-url" placeholder="e.g example.mp3">
                        </div>
                        <div class="form-group">
                            <label for="price">Price</label>
                            <input type="text" id="price" placeholder="e.g $36">
                        </div>
                    </div>
                <!-- tailwind grid 3 -->
                    <div class="form-grid buttons sm:col-span-full">
                        <div class="btns">
                            <button type="submit" id="save-book-btn">Save</button>
                            <!-- cancel btn will be added by appendChild method of js -->
                        </div>
                    </div>
                </form>
            </div>
            <!-- footer -->
            <footer class="book-footer flex justify-center">
                 <p class="footer-text">© 2026, Made by Invenire Team.</p>
            </footer>
        </div>
    </div>

    <!-- 3. ATTACH YOUR JAVASCRIPT LOGIC SCRIPT (Note the type="module" declaration) -->
    <!-- <script type="module" src="../../js/subPages/books.js"></script> -->
     <script src="../../js/dashboard/sub_pages/theme.js"></script>
</body>
</html>
