<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminBooks Management</title>
    <!-- css style link -->
    <link href="/src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css-style/main-pages/home.css"> <!-- for the base root linked-->
    <link rel="stylesheet" href="../../css-style/sub-pages/reports.css">
    <!-- ===========responsive layout -->
    <link rel="stylesheet" href="../../responsive/dashboard/sidebar_profile_responsive.css">
    <!-- ==========search bar js link-->
    <script type="module" src="../../js/dashboard/search_bar/search.js" defer></script>
    <script type="module" src="../../js/dashboard/search_bar/books_search.js" defer></script>
    <script type="module" src="../../js/dashboard/search_bar/members_search.js" defer></script>
    <!-- ==============user profile js logic -->
    <script type="module" src="../../js/dashboard/acount/profile.js" defer></script>
    <!-- ==============current js logic link -->
    <script type="module" src="../../js/dashboard/sub_pages/report.js" defer></script>
    <!-- tailwind and font awesome -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    </head>
<body>
    <!-- main container include main body sidebar and header -->
    <div class="report-container">
        <aside class="sidebar"> 
            <div class="logo">
                <img src="../../images/logo/logo.png" alt="">
            </div>
            <hr class="h-px bg-gray-300 border-0">
            <div class="sidebar-menu">
                <div class="menu-item">
<!-- ===================used two different <a> on every item cause responsive style not crash======================= -->
                <a class="menu-icon" href="../home.html">
                    <i class="fa-solid fa-home"></i>
                </a>
                    <a href="../home.html" class="menu-text">Home</a>
                </div>
                <div class="menu-item" data-route="Dashboard">
                    <a class="menu-icon" href="../admin_dashboard.html">
                        <i class="fa-solid fa-th-large"></i>
                    </a>
                    <a href="../admin_dashboard.html"><span class="menu-text">Dashboard</span></a>
                </div>
                <div class="menu-item data-route="Books">
                    <a class="menu-icon" href="books.html">
                        <i class="fa-solid fa-book menu-icon"></i>
                    </a>
                    <a href="books.html"><span class="menu-text">Books</span></a>
                </div>
                <div class="menu-item" data-route="Members">
                    <a class="menu-icon" href="members.html">
                        <i class="fa-solid fa-users"></i>
                    </a>
                    <a href="members.html">
                    <span class="menu-text">Members</span></a>
                </div>
                <div class="menu-item" data-route="Settings">
                    <a class="menu-icon" href="settings.html">
                        <i class="fa-solid fa-cog "></i>
                    </a>
                    <a href="settings.html">
                    <span class="menu-text">Settings</span></a>
                </div>
                <div class="menu-item" active data-route="Statistic">
                    <a class="menu-icon" href="reports.html">
                        <i class="fa-solid fa-chart-bar "></i>
                    </a>
                    <a href="reports.html">
                    <span class="menu-text">Statistic</span></a>
                </div>
                <hr class="w-full h-px bg-gray-400 border-0">
                <div class="menu-item" data-route="Theme">
                    <a class="menu-icon" href="theme.html">
                        <i class="fa-solid fa-palette"></i>
                    </a>
                    <a class="menu-text" href="theme.html"></i>
                    <span class="menu-text">Theme</span></a>
                </div>

                <button class="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout
                </button>
            </div>
        </aside>

        <!-- main content of body plus header start from here -->
        <div class="report-main-content">
            <!-- HEADER PART -->
            <header class="admin-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search books,members,author...." class="search-input" autocomplete="off">
                    <!-- a dropdown container shows the search result -->
                    <div class="searchResult" id="search-dropDown"></div>
                </div>
                <div class="calender">
                    <div class="time">12:45</div>
                    <!-- layout added as tailwind css here -->
                    <div class="divider-line h-4 w-[0.4px] bg-slate-600 mx-2 xs:w-8 xs:h-[0.4px] sm:w-10 sm:h-[0.4px] md:w-16 md:h-[1px] lg:h-4 lg:w-[1px]"></div>
                    <div class="date">21/July/2026</div>
                </div>
                <div class="profile-container">
                    <div class="profile">
                        <img src="../../images/profile/female.jpg" alt="">
                    </div>
                </div>
            </header>
            <!-- Your main page content goes here -->
            <main></main>
            <!-- footer -->
            <footer class="report-footer">
            <p class="footer-text">© 2026, Made by Invenire Team.</p>
        </footer>
        </div>
    </div>
</body>
</html>
