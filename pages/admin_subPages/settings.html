<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminBooks Management</title>
    <!-- css style link -->
    <link href="/src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css-style/root.css"> <!-- for the base root linked-->
    <link rel="stylesheet" href="../../css-style/sub-pages/settings.css">
    <!-- ===========responsive layout -->
    <link rel="stylesheet" href="../../responsive/dashboard/sidebar_profile_responsive.css">
    <!-- ==========search bar js link-->
    <script type="module" src="../../js/dashboard/search_bar/search.js" defer></script>
    <script type="module" src="../../js/dashboard/search_bar/books_search.js" defer></script>
    <script type="module" src="../../js/dashboard/search_bar/members_search.js" defer></script>
    <!-- ==============user profile js logic -->
    <script type="module" src="../../js/auth-files/profile.js"></script>
    <!-- =================logut logic js file -->
    <script type="module" src="../../js/auth-files/logout.js"></script>
    <!-- ==============current js logic link -->
    <script type="module" src="../../js/dashboard/sub_pages/settings.js" defer></script>
    <!-- tailwind and font awesome -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    </head>
<body>
    <!-- main container include main body sidebar and header -->
    <div class="setting-container">
        <aside class="sidebar"> 
            <div class="logo">
                <img src="../../images/logo/logo.png" alt="">
            </div>
            <hr class="h-px bg-gray-300 border-0">
            <div class="sidebar-menu">
                <div class="menu-item">
<!-- ===================used two different <a> on every item cause responsive style not crash======================= -->
                <a class="menu-icon" href="../home.html">
                    <i class="fa-solid fa-home"></i>
                </a>
                    <a href="../home.html" class="menu-text">Home</a>
                </div>
                <div class="menu-item" data-route="Dashboard">
                    <a class="menu-icon" href="../admin_dashboard.html">
                        <i class="fa-solid fa-th-large"></i>
                    </a>
                    <a href="../admin_dashboard.html"><span class="menu-text">Dashboard</span></a>
                </div>
                <div class="menu-item data-route="Books">
                    <a class="menu-icon" href="books.html">
                        <i class="fa-solid fa-book menu-icon"></i>
                    </a>
                    <a href="books.html"><span class="menu-text">Books</span></a>
                </div>
                <div class="menu-item" data-route="Members">
                    <a class="menu-icon" href="members.html">
                        <i class="fa-solid fa-users"></i>
                    </a>
                    <a href="members.html">
                    <span class="menu-text">Members</span></a>
                </div>
                <div class="menu-item" active data-route="Settings">
                    <a class="menu-icon" href="settings.html">
                        <i class="fa-solid fa-cog "></i>
                    </a>
                    <a href="settings.html">
                    <span class="menu-text">Settings</span></a>
                </div>
                <hr class="w-full h-px bg-gray-400 border-0">
                <div class="menu-item" data-route="Theme">
                    <a class="menu-icon" href="theme.html">
                        <i class="fa-solid fa-palette"></i>
                    </a>
                    <a class="menu-text" href="theme.html"></i>
                    <span class="menu-text">Theme</span></a>
                </div>

                <button class="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout
                </button>
            </div>
        </aside>

        <!-- main content of body plus header start from here -->
        <div class="setting-main-content">
            <!-- HEADER PART -->
            <header class="admin-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search books,members,author...." class="search-input" autocomplete="off">
                    <!-- a dropdown container shows the search result -->
                    <div class="searchResult" id="search-dropDown"></div>
                </div>
                <div class="calender">
                    <div class="time">12:45</div>
                    <!-- layout added as tailwind css here -->
                    <div class="divider-line h-4 w-[0.4px] bg-slate-600 mx-2 xs:w-8 xs:h-[0.4px] sm:w-10 sm:h-[0.4px] md:w-16 md:h-[1px] lg:h-4 lg:w-[1px]"></div>
                    <div class="date">21/July/2026</div>
                </div>
                <div class="profile-container">
                    <div class="profile">
                        <img src="../../images/profile/female.jpg" alt="">
                    </div>
                </div>
            </header>
            <!-- Your main page content goes here -->
            <!-- Main Settings Content Area -->
<div class="settings-container">
    <h2>Account Settings</h2>
    <div id="settingsGlobalError" class="form-error" style="display:none; color:red; margin-bottom:15px;"></div>
    <div id="settingsGlobalSuccess" class="form-success" style="display:none; color:green; margin-bottom:15px;"></div>

    <form id="settingsForm">
        <!-- Profile Image Blending Panel -->
        <div class="settings-avatar-group">
            <div class="avatar-preview-wrapper">
                <img id="settingsAvatarPreview" src="../../assets/images/defaultProfile.png" alt="Profile Avatar" style="width:100px; height:100px; border-radius:50%;">
            </div>
            <label for="settingsGender">Gender Avatar Base:</label>
            <select id="settingsGender">
                <option value="">Keep Current / Unset</option>
                <option value="male">Male (Man Avatar)</option>
                <option value="female">Female (Woman Avatar)</option>
            </select>
        </div>

        <!-- Full Name Info Input -->
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="settingsFullName" placeholder="Enter your full name">
            <span id="settingsFullNameError" class="error-message" style="display:none; color:red;"></span>
        </div>

        <!-- Account Email String -->
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="settingsEmail" placeholder="Enter your email address">
            <span id="settingsEmailError" class="error-message" style="display:none; color:red;"></span>
        </div>

        <!-- Security Password Reset Blocks -->
        <div class="input-group">
            <label>New Password (Leave blank to keep unchanged)</label>
            <input type="password" id="settingsNewPassword" placeholder="Minimum 8 characters">
            <span id="settingsPasswordError" class="error-message" style="display:none; color:red;"></span>
        </div>

        <button type="submit" class="save-settings-btn">Save Changes</button>
    </form>

    <hr style="margin: 40px 0; border: 0; border-top: 1px solid #ddd;">

    <!-- Danger Zone: Delete Account Section -->
    <div class="danger-zone">
        <h3>Danger Zone</h3>
        <p>Once you delete your account, your profile records and tracking metrics will be wiped out from the platform database completely. This action cannot be reversed.</p>
        <button id="deleteAccountBtn" class="delete-account-btn" style="background-color: #dc3545; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">Delete Account</button>
    </div>
</div>

            <!-- footer -->
            <footer class="setting-footer">
            <p class="footer-text">© 2026, Made by Invenire Team.</p>
        </footer>
        </div>
    </div>
</body>
</html>
