<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminBooks Management</title>
    <!-- Font Awesome Link for icons (matches your dashboard setup) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="../../css-style/main-pages/home.css"> <!-- for the base root linked-->
    <link rel="stylesheet" href="../../css-style/sub-pages/books.css">
    <script type="module" src="../../js/dashboard/search.js" defer></script>
    <script type="module" src="../../js/dashboard/books_search.js" defer></script>
    <script type="module" src="../../js/dashboard/members_search.js" defer></script>
</head>
<body>
    <!-- main container include main body sidebar and header -->
    <div class="books-container">
        <aside class="book-sidebar"> 
            <div class="logo">
                <img src="/images/logo/logo.png" alt="Invenire Library" class="logo">
            </div>
            <hr class="h-px bg-gray-300 border-0">
            <div class="sidebar-menu">
                <div class="menu-item" data-route="Notifications">
                    <a href="./notification.html">
                    <i class="fa-solid fa-bell menu-icon"></i>
                    <span class="menu-text">Notifications</span> </a>
                </div>
                <div class="menu-item" data-route="Dashboard">
                    <a href="../admin_dashboard.html">
                    <i class="fa-solid fa-th-large menu-icon"></i>
                    <span class="menu-text">Dashboard</span></a>
                </div>
                <div class="menu-item active" data-route="Books">
                    <a href="./books.html">
                    <i class="fa-solid fa-book menu-icon"></i>
                    <span class="menu-text">Books</span></a>
                </div>
                <div class="menu-item" data-route="Members">
                    <a href="./members.html">
                    <i class="fa-solid fa-users menu-icon"></i>
                    <span class="menu-text">Members</span></a>
                </div>
                <div class="menu-item" data-route="Settings">
                    <a href="./settings.html">
                    <i class="fa-solid fa-cog menu-icon"></i>
                    <span class="menu-text">Settings</span></a>
                </div>
                <div class="menu-item" data-route="Statistic">
                    <a href="./reports.html">
                    <i class="fa-solid fa-chart-bar menu-icon"></i>
                    <span class="menu-text">Statistic</span></a>
                </div>
                <hr class="w-full h-px bg-gray-400 border-0">
                <div class="menu-item" data-route="Theme">
                    <a href="./theme.html">
                    <i class="fa-solid fa-palette menu-icon"></i>
                    <span class="menu-text">Theme</span></a>
                </div>

                <button class="logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Logout
                </button>
            </div>
        </aside>

        <!-- main content of body plus header start from here -->
        <div class="book-main-content">
            <header class="admin-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search books,members,author...." class="search-input" autocomplete="off">
                    <!-- a dropdown container shows the search result -->
                    <div class="searchResult" id="search-dropDown"></div>
                </div>
                <div class="calender">
                    <div class="time">12:45</div>
                    <div class="h-4 w-[1px] bg-slate-600 mx-2"></div>
                    <div class="date">21/July/2026</div>
                </div>
                <div class="profile-container">
                    <div class="profile"></div>
                </div>
            </header>
            <div class="all-member-list">

            </div>

        </div>
    </div>
</body>
</html>
